// pantalla blanca. Guardamos una copia de las 3 imprescindibles (React,
// ReactDOM y htm) la primera vez que cargan bien, y si el CDN no responde
// se levantan desde ahí. Sin ellas la app ni arranca; pdf.js y xlsx solo
// hacen falta para importar y se avisa si faltan.
(function(){
  var CACHE="inv-lib-cache-v1";

    {k:"react",u:"https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",g:"React"},

  function leerCache(){try{return JSON.parse(localStorage.getItem(CACHE)||"{}");}catch(e){return{};}}
  var cache=leerCache(),faltan=[];
  LIBS.forEach(function(l){
    if(window[l.g])return;
    if(cache[l.k]){try{(0,eval)(cache[l.k]);}catch(e){console.error("cache "+l.k,e);}}
    if(!window[l.g])faltan.push(l);
  });

      document.body.innerHTML='<div style="font-family:Arial,sans-serif;max-width:520px;margin:60px auto;padding:24px;text-align:center;color:#1e293b">'+

    });

function diff(sys,fis){if(fis===""||fis==null||sys===""||sys==null)return{abs:"",pct:""};const s=+sys,f=+fis;if(isNaN(s)||isNaN(f))return{abs:"",pct:""};return{abs:f-s,pct:s!==0?((f-s)/s*100).toFixed(2)+"%":"0.00%"};}
// Detecta el separador dominante del archivo. Antes se cortaba por coma, punto
// y coma y tabulación a la vez: en un archivo separado por ";" con decimales
// por coma ("1.234,56") partía el número y se perdían los centavos.
// Normaliza fechas de listados bancarios a AAAA-MM-DD.
function fechaISO(v){
  if(v==null||v==="")return "";
  const t=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);
  const m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(t);
  if(m){let[,d,mes,a]=m;a=a.length===2?(+a>70?"19":"20")+a:a;
    return a+"-"+String(mes).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  if(/^\d{5}$/.test(t)){ // serial de Excel
    const base=new Date(Date.UTC(1899,11,30));base.setUTCDate(base.getUTCDate()+Number(t));
    return base.toISOString().slice(0,10);}
  return "";
}

// ── Formato numérico ──────────────────────────────────────────────────
// "31.000" es 31000 en formato argentino y 31,0 en formato con punto decimal
// (el que usan algunos sistemas, ej. los listados de Porteña). No se puede
// resolver mirando un valor suelto: se detecta por columna y se confirma en
// la pantalla de importación.
function detectarFormatoNum(valores){
  let ar=0,us=0;
  (valores||[]).forEach(v=>{
    const t=String(v==null?"":v).replace(/[$\s]/g,"").trim();
    if(!t||!/\d/.test(t))return;
    if(/,\d+$/.test(t)){ar++;return;}                    // coma decimal -> argentino
    if(/\.\d{3}(\.\d{3})+$/.test(t)){ar++;return;}       // dos o más grupos de miles
    const m=/\.(\d+)$/.exec(t);
    if(m&&m[1].length!==3){us++;return;}                 // punto con != 3 decimales
  });
  if(us>ar)return "us";
  if(ar>0)return "ar";
  return "ar"; // por defecto, convención argentina
}
// Un importe es "raro" solo si no encaja en NINGUNA de las dos convenciones.
// Ahora que el parser decide valor por valor, "1234.56" y "1.234,56" son
// igual de válidos; lo que se marca es lo que no se puede leer, como
// "1.234.567.89" (punto de miles y de centavos a la vez).
function numRaro(v){
  const t=String(v==null?"":v).replace(/[^\d.,\-]/g,"").replace(/^-/,"").trim();
  if(!t||!/\d/.test(t))return false;
  const ar=/^\d{1,3}(\.\d{3})*(,\d+)?$|^\d+(,\d+)?$/;
  const us=/^\d{1,3}(,\d{3})*(\.\d+)?$|^\d+(\.\d+)?$/;
  return !(ar.test(t)||us.test(t));
}

// Interpreta un importe decidiendo el separador decimal VALOR POR VALOR.
// Solo cuando el valor es genuinamente ambiguo ("1.234": ¿mil doscientos o
// uno con doscientos treinta y cuatro?) se usa `formato` para desempatar.
// Así un mismo archivo puede traer "1.234.567,89" y "1234.56" mezclados.
function sepDecimalDe(t,formato){
  const hayC=t.indexOf(",")>=0, hayP=t.indexOf(".")>=0;
  if(hayC&&hayP)return t.lastIndexOf(",")>t.lastIndexOf(".")?",":".";   // el último manda
  if(!hayC&&!hayP)return null;
  const sep=hayC?",":".";
  const partes=t.split(sep);
  if(partes.length>2)return null;                 // varios separadores -> miles
  const d=partes[1];
  if(d.length!==3)return sep;                     // 1, 2 o 4+ dígitos -> decimal
  // exactamente 3 dígitos: ambiguo, desempata el formato elegido
  return (formato==="us"&&sep===".")||(formato==="ar"&&sep===",")?sep:null;
}
function esAmbiguo(v){
  const t=String(v==null?"":v).replace(/[^\d.,]/g,"");
  if(!/\d/.test(t))return false;
  const hayC=t.indexOf(",")>=0,hayP=t.indexOf(".")>=0;
  if(hayC&&hayP)return false;
  if(!hayC&&!hayP)return false;
  const partes=t.split(hayC?",":".");

}
function parseNum(v,formato){
  if(v==null||v==="")return NaN;
  if(typeof v==="number")return v;
  const bruto=String(v).trim();
  let t=bruto.replace(/[^\d.,()\-]/g,"");
  if(!/\d/.test(t))return NaN;
  const neg=/^\(.*\)$/.test(bruto)||t.indexOf("-")===0;
  t=t.replace(/[()\-]/g,"");

    r=parseFloat(t.split(otro).join("").replace(dec,"."));}

  if(isNaN(r))return NaN;
  return neg?-r:r;
}

        const descItems=sameRow.filter(it=>it.x>code.x+30&&!/^-?[\d.,]+$/.test(it.t)&&!["Kilos","Litros","Garrafa","Sobre","Filtro","Unidad","Pote","Bolson","Gramo","Pack"].includes(it.t)&&!it.t.startsWith("Bls ")&&!it.t.startsWith("Bid ")&&!it.t.startsWith("lata ")&&!it.t.startsWith("tambor"));

        if(!stock){stockItem=sameRow.find(it=>/^-?\d[\d.]*,\d{3}$/.test(it.t));
          if(stockItem){const sv=stockItem.t.replace(/\./g,"").replace(",",".");const sn=parseFloat(sv);if(!isNaN(sn))stock=String(Math.round(sn*100)/100);}}
        if(!descripcion)continue;

        const unitItem=sameRow.find(it=>["Kilos","Litros","Garrafa","Sobre","Filtro","Unidad","Pote","Bolson","Gramo"].includes(it.t)||it.t.startsWith("Bls ")||it.t.startsWith("Bid ")||it.t.startsWith("lata ")||it.t.startsWith("tambor")||it.t.startsWith("Lata "));
        if(unitItem){const u=unitItem.t;if(u==="Kilos"||u==="Gramo")unidad="Kilos";else if(u==="Litros")unidad="Litros";else if(u.startsWith("Bls 25")||u==="Bolson")unidad="Bolsa 25 Kg";else if(u.startsWith("Bls 20"))unidad="Bolsa 20 Kg";else if(u.startsWith("Bls 40"))unidad="Bolsa 25 Kg";else if(u.startsWith("Bls 10")||u.startsWith("Bls 15"))unidad="Bolsa 10 Kg";else if(u==="Pote"||u==="Filtro"||u==="Sobre"||u==="Garrafa"||u==="Unidad")unidad="Unidad";else if(u.startsWith("Bid"))unidad="Bidón";else if(u.startsWith("lata")||u.startsWith("Lata")||u.startsWith("tambor"))unidad="Unidad";
        } else {const dl=descripcion.toLowerCase();if(dl.includes("lts")||dl.includes("litro"))unidad="Litros";else if(dl.includes("kg")||dl.includes("kilo"))unidad="Kilos";}
        let importe="";const stockX=stockItem?stockItem.x:0;

        if(importeItems.length>0){const iv=importeItems[0].t.replace(/\./g,"").replace(",",".");const in2=parseFloat(iv);if(!isNaN(in2))importe=String(Math.round(in2*100)/100);}

function SignaturePad({label,value,onChange}){
  // La firma NO es un canvas siempre activo: mientras está cerrada no captura
  // nada, así el scroll no le agrega trazos. Se firma en un modal a pantalla
  // completa, se guarda y queda bloqueada.
  const[abierto,setAbierto]=useState(false);
  const canRef=useRef();const boxRef=useRef();const dib=useRef(false);const huboTrazo=useRef(false);
  const caja=useRef(null); // recuadro del trazo, en coordenadas CSS
  // El canvas se dimensiona al tamaño REAL en pantalla (antes era fijo 300x120
  // estirado por CSS, y el trazo salía corrido del dedo).
  const[apaisado,setApaisado]=useState(false);
  // El lienzo ocupa toda la pantalla y se reajusta al girar el celular,
  // conservando lo ya firmado (redimensionar un canvas lo borra).
  const dimensionar=(preservar)=>{
    const el=canRef.current;if(!el)return;
    try{
      let prev=null;
      if(preservar&&huboTrazo.current){try{prev=el.toDataURL("image/png");}catch(e){}}
      const r=el.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
      const w=Math.max(1,Math.round((r.width||300)*dpr)),h=Math.max(1,Math.round((r.height||150)*dpr));
      if(el.width===w&&el.height===h&&preservar)return;
      el.width=w;el.height=h;
      const ctx=el.getContext("2d");if(ctx.scale)ctx.scale(dpr,dpr);
      ctx.lineWidth=Math.max(2.6,(r.width||300)/150);ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0f172a";
      setApaisado((r.width||0)>(r.height||0));
      if(prev){const img=new Image();img.onload=()=>{try{ctx.drawImage(img,0,0,r.width,r.height);}catch(e){}};img.src=prev;}
      else{huboTrazo.current=false;caja.current=null;}
    }catch(e){console.error("firma:",e);}
  };
  useEffect(()=>{
    if(!abierto)return;
    const t=setTimeout(()=>dimensionar(false),30);
    const onR=()=>dimensionar(true);
    window.addEventListener("resize",onR);
    window.addEventListener("orientationchange",onR);
    return()=>{clearTimeout(t);window.removeEventListener("resize",onR);window.removeEventListener("orientationchange",onR);};
  },[abierto]);
  const pos=(e)=>{const r=canRef.current.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const marcar=(p)=>{const c=caja.current;if(!c)caja.current={x1:p.x,y1:p.y,x2:p.x,y2:p.y};else{c.x1=Math.min(c.x1,p.x);c.y1=Math.min(c.y1,p.y);c.x2=Math.max(c.x2,p.x);c.y2=Math.max(c.y2,p.y);}};
  const start=(e)=>{e.preventDefault();dib.current=true;const ctx=canRef.current.getContext("2d");ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);marcar(p);};
  const move=(e)=>{if(!dib.current)return;e.preventDefault();const ctx=canRef.current.getContext("2d");const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();marcar(p);huboTrazo.current=true;};
  const end=()=>{dib.current=false;};
  const limpiar=()=>{const c=canRef.current;if(!c)return;c.getContext("2d").clearRect(0,0,c.width,c.height);huboTrazo.current=false;caja.current=null;};
  // Se guarda SOLO el rectángulo firmado, no toda la pantalla en blanco:
  // así la firma llena el espacio del informe en vez de verse diminuta.
  const guardar=()=>{
    if(!huboTrazo.current){alert("Todavía no firmaste.\n\nFirmá con el dedo dentro del recuadro y después tocá Guardar firma.");return;}
    try{
      const el=canRef.current;const dpr=window.devicePixelRatio||1;
      const r=el.getBoundingClientRect();
      const c=caja.current||{x1:0,y1:0,x2:r.width,y2:r.height};
      const pad=Math.max(12,(c.x2-c.x1)*0.05);
      let x=Math.max(0,c.x1-pad),y=Math.max(0,c.y1-pad);
      let w=Math.min(r.width,c.x2+pad)-x,h=Math.min(r.height,c.y2+pad)-y;
      // Se AMPLÍA hasta 3:1 tomando más lienzo alrededor. Nunca se achica el
      // recorte: recortar cortaba la firma por arriba y por abajo.
      if(w/h<3){
        const nw=Math.min(r.width,h*3);
        x=Math.max(0,Math.min(x-(nw-w)/2,r.width-nw));
        w=nw;
        if(w/h<3){const nh=Math.min(r.height,w/3);
          if(nh>=h){y=Math.max(0,Math.min(y-(nh-h)/2,r.height-nh));h=nh;}}
      }
      if(w<20||h<8){onChange(el.toDataURL("image/png"));setAbierto(false);return;}
      const out=document.createElement("canvas");
      const escala=Math.min(4,Math.max(2,900/w)); // ~900px de ancho para imprimir nítido
      out.width=Math.round(w*escala);out.height=Math.round(h*escala);
      const octx=out.getContext("2d");
      if(octx.drawImage)octx.drawImage(el,Math.round(x*dpr),Math.round(y*dpr),Math.round(w*dpr),Math.round(h*dpr),0,0,out.width,out.height);
      onChange(out.toDataURL("image/png"));
    }catch(e){console.error("recorte de firma:",e);onChange(canRef.current.toDataURL("image/png"));}
    setAbierto(false);};
  const rehacer=()=>{if(value&&!confirm("¿Rehacer la firma?\n\nSe borra la firma guardada."))return;onChange(null);setAbierto(true);};
  return html`<div style=${{marginBottom:10}}>
    <label style=${{fontSize:12,fontWeight:700,color:"#475569",display:"block",marginBottom:4}}>${label}</label>
    ${value?html`<div ref=${boxRef} style=${{border:"2px solid #16a34a",borderRadius:10,background:"#f0fdf4",padding:8}}>
      <img src=${value} alt="Firma" style=${{width:"100%",maxWidth:340,maxHeight:130,objectFit:"contain",display:"block",margin:"0 auto",pointerEvents:"none"}} />
      <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginTop:6}}>
        <span style=${{fontSize:11,color:"#16a34a",fontWeight:700}}>🔒 Firmado y bloqueado</span>
        <button onClick=${rehacer} style=${{background:"#fff",border:"1.5px solid #cbd5e1",borderRadius:7,padding:"5px 11px",fontSize:11,fontWeight:600,color:"#475569"}}>Rehacer firma</button>
      </div></div>`
    :html`<button onClick=${()=>setAbierto(true)} style=${{width:"100%",maxWidth:300,padding:"16px 12px",border:"2px dashed #cbd5e1",borderRadius:10,background:"#fafbfc",color:"#64748b",fontSize:13,fontWeight:700}}>✍ Firmar</button>`}
    ${abierto&&html`<div style=${{position:"fixed",inset:0,background:"#0f172a",zIndex:400,display:"flex",flexDirection:"column",padding:8}}>
      <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"2px 4px 6px",color:"#fff"}}>
        <span style=${{fontSize:13,fontWeight:800}}>${label}</span>
        <span style=${{fontSize:10,color:"#94a3b8"}}>${apaisado?"Firmá sobre la línea":"Girá el celular para que el recuadro sea más grande"}</span>
      </div>
      <div style=${{flex:1,minHeight:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style=${{position:"relative",width:"100%",maxWidth:"100%",aspectRatio:"3 / 1",maxHeight:"100%",background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 0 0 3px rgba(255,255,255,.15)"}}>
          <canvas ref=${canRef}
            onMouseDown=${start} onMouseMove=${move} onMouseUp=${end} onMouseLeave=${end}
            onTouchStart=${start} onTouchMove=${move} onTouchEnd=${end} onTouchCancel=${end}
            style=${{width:"100%",height:"100%",display:"block",touchAction:"none",cursor:"crosshair"}} />
          <div style=${{position:"absolute",left:"5%",right:"5%",bottom:"20%",borderBottom:"1.5px dashed #cbd5e1",pointerEvents:"none"}} />
          <div style=${{position:"absolute",left:0,right:0,bottom:4,textAlign:"center",fontSize:9,color:"#cbd5e1",pointerEvents:"none",letterSpacing:.4}}>Este recuadro es el tamaño exacto que va al informe</div>
        </div>
      </div>
      <div style=${{display:"flex",gap:8,paddingTop:8}}>
        <button onClick=${()=>setAbierto(false)} style=${{flex:1,padding:"13px",border:"none",borderRadius:10,background:"#334155",color:"#fff",fontSize:13,fontWeight:700}}>Cancelar</button>
        <button onClick=${limpiar} style=${{flex:1,padding:"13px",border:"none",borderRadius:10,background:"#475569",color:"#fff",fontSize:13,fontWeight:700}}>Borrar</button>
        <button onClick=${guardar} style=${{flex:2,padding:"13px",border:"none",borderRadius:10,background:"#16a34a",color:"#fff",fontSize:15,fontWeight:800}}>✓ Guardar firma</button>
      </div>
    </div>`}
  </div>`;
}

const arqTieneDatos=(arq)=>{if(!arq)return false;const num=(v)=>parseFloat(String(v??"").replace(/\./g,"").replace(",","."))||0;
  if(num(arq.saldoSist)>0||num(arq.saldoPesos)>0||num(arq.saldoDolares)>0||num(arq.saldoCheques)>0)return true;
  if(num(arq.totalBilletes)>0||num(arq.totalDolares)>0||num(arq.totalMonedas)>0)return true;
  if(Object.values(arq.billetes||{}).some(v=>+v>0))return true;
  if(Object.values(arq.monedas||{}).some(v=>+v>0))return true;
  if(Object.values(arq.dolares||{}).some(v=>+v>0))return true;
  if((arq.cheques||[]).length>0)return true;
  if(arq.obs&&String(arq.obs).trim())return true;
  return false;};
const cubTieneDatos=(cub)=>{if(!cub)return false;const deps=cub.depositos||[];
  return deps.some(d=>(d.alto!==""&&d.alto!=null)||(d.largo!==""&&d.largo!=null)||(d.ancho!==""&&d.ancho!=null)||(d.diametro!==""&&d.diametro!=null)||(d.stockSist!==""&&d.stockSist!=null));};
const medTieneDatos=(med)=>{if(!med)return false;return Object.keys(med).some(k=>{const m=med[k];return m&&((m.cm!==""&&m.cm!=null)||(m.litrosDir!==""&&m.litrosDir!=null)||(m.pct!==""&&m.pct!=null)||(m.stockSist!==""&&m.stockSist!=null));});};


// ╔══════════════════════════════════════════════════════════════════╗
// ║  MOTOR ÚNICO DE INFORMES                                          ║
// ║  Un solo cálculo, un solo catálogo de riesgos/recomendaciones y   ║
// ║  un solo generador de HTML. El informe de sección y el general    ║
// ║  se diferencian SOLO por el alcance, nunca por el contenido.      ║
// ╚══════════════════════════════════════════════════════════════════╝
const escH=(v)=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const nOk=(v)=>v!==""&&v!=null&&!isNaN(parseFloat(v));
const money=(v)=>"$ "+Number(v||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});

// ── Cálculo único por sección ────────────────────────────────────────
// Todo número que aparezca en cualquiera de los dos informes sale de acá.
function statsSeccion(secData){
  const items=(secData&&secData.items)||[];
  const contados=items.filter(it=>it.stockFisico!==""&&it.stockFisico!=null);
  const conDif=contados.filter(it=>{const d=diff(it.stockSistema,it.stockFisico);return d.abs!==""&&d.abs!==0;});
  const sobrantes=conDif.filter(it=>+it.stockFisico>+it.stockSistema);
  const faltantes=conDif.filter(it=>+it.stockFisico<+it.stockSistema);
  const negativos=items.filter(it=>nOk(it.stockSistema)&&+it.stockSistema<0);
  const negMonto=negativos.reduce((a,it)=>a+(nOk(it.importe)?Math.abs(+it.importe):0),0);
  const vencidos=items.filter(it=>it.estado==="Vencido");
  const rotos=items.filter(it=>it.estado==="Roto/Dañado"||it.estado==="No utilizable");
  const faltaComp=items.filter(it=>it.estado==="Falta comprobante");
  const conObs=items.filter(it=>it.estado&&it.estado!=="OK");
  const universo=parseFloat(secData&&secData.totalSistema)||0;
  // El auditor puede declararlo explícitamente. Hace falta cuando la muestra
  // se armó por fuera y en la app entra completa (se contó todo lo cargado,
  // pero lo cargado NO es el universo).
  const modo=(secData&&secData.modoConteo)||"";
  const esMuestra=modo==="muestra"||(modo!=="total"&&(!!(secData&&secData.muestra)||(items.length>0&&contados.length>0&&contados.length<items.length)));
  return{items,contados,conDif,sobrantes,faltantes,negativos,negMonto,vencidos,rotos,faltaComp,conObs,universo,esMuestra,
    total:items.length,nContados:contados.length,nDif:conDif.length};
}

// ── Catálogo único de riesgos y recomendaciones ──────────────────────
function riesgosRecos(st,secTipo,extra){
  extra=extra||{};
  const R=[],C=[];
  if(extra.sinSistema){
    R.push("Los insumos y productos en existencia no se encuentran respaldados por un sistema informático de inventario, por lo que no es posible cotejar el recuento físico contra un registro sistémico.");
    C.push("Llevar un registro de stock a través de un sistema de inventario en esta sección, de manera que las existencias no puedan ser modificadas manualmente sin el respaldo correspondiente.");
    C.push("Hasta tanto se implemente el sistema, formalizar el papel de trabajo interno: numerarlo, fecharlo y firmarlo por el responsable de la sección.");
  }
  if(secTipo==="conteo"||secTipo==="muestreo"){
    if(st.nDif>0)R.push("Se detectaron diferencias entre el stock físico y el registrado en el sistema en "+st.nDif+" producto(s).");

  }

    if(st.nDif>0)R.push("Se detectaron diferencias en "+st.nDif+" producto(s) de lubricantes y grasas.");
    C.push("Realizar varillajes periódicos y conciliarlos con el stock del sistema.");
    C.push("Verificar la calibración de las tablas de varillaje de los tanques de combustible.");
    C.push("Controlar que los despachos de combustible se registren en el sistema en tiempo real.");

    C.push("Establecer medidas de seguridad que restrinjan el acceso de terceros a los depósitos de combustibles y lubricantes.");
  }
  if(secTipo==="arqueo"){

    C.push("Rendir diariamente las cajas de sucursales hacia la caja central.");

function textoProcedimiento(secTipo,st,rubros,sinSistema){
  const r=(rubros&&rubros.length)?" de "+rubros.join(", ").toLowerCase():"";
  if(sinSistema)return "La sección no cuenta con un sistema informático de inventario que respalde las existencias"+r+". Se relevó el detalle a partir del papel de trabajo provisto por el personal de la Cooperativa, que se adjunta como evidencia, validando contra él las existencias físicas en presencia del encargado del lugar."+
    (st&&st.nContados>0?" Se controlaron "+st.nContados+" ítem(s) sobre ese detalle.":"");
  if(secTipo==="conteo"||secTipo==="muestreo"){
    if(st.esMuestra){
      const sobre=st.universo>0?" sobre un total de "+fmt(st.universo)+" según listado del sistema":(st.nContados<st.total?" sobre un total de "+st.total:"");
      return "Se realizó el recuento en base a una muestra aleatoria y representativa de "+st.nContados+" producto(s)"+sobre+r+", verificando la existencia y propiedad de los artículos listados por el sistema, en presencia del encargado del lugar. Se controlaron además los vencimientos mediante muestras aleatorias.";
    }

  }
  if(secTipo==="varillaje")return "Se constató el stock de combustible mediante procedimiento de varillaje de los tanques y se realizó el recuento de los lubricantes en existencia, en presencia del encargado del lugar.";
  if(secTipo==="arqueo")return "Se efectuó el recuento de billetes y monedas y el control de valores al cobro, cotejando ambos con el saldo contable de cada caja, en presencia de los cajeros responsables, con su posterior devolución.";

  return "Se realizó el relevamiento de la sección en presencia del encargado del lugar.";
}

// ═══ STORAGE HELPER ═══
const DB_POS="inv-audit-pos";const DB_KEY="inv-audit-data";const DB_CFG="inv-audit-config";const DB_SNAP="inv-audit-snapshots";
const FOTO_PFX="inv-foto-";
// ── Fotos en claves propias ──────────────────────────────────────────
// Cada clave de almacenamiento tiene un techo de 5 MB. Con las fotos
// embebidas en los datos, unas 55 fotos llenaban la clave principal y se
// perdía TODO el inventario. Acá las sacamos del árbol antes de guardar y
// las volvemos a poner al cargar: la app sigue viendo las fotos inline.
const _hashFoto=(str)=>{let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36)+"-"+str.length.toString(36);};
const esFoto=(v)=>typeof v==="string"&&v.slice(0,11)==="data:image/";
const esRefFoto=(v)=>typeof v==="string"&&v.slice(0,7)==="@foto::";
function extraerFotos(nodo,mapa){
  if(esFoto(nodo)){const id=_hashFoto(nodo);mapa[id]=nodo;return "@foto::"+id;}
  if(Array.isArray(nodo))return nodo.map(x=>extraerFotos(x,mapa));
  if(nodo&&typeof nodo==="object"){const o={};for(const k in nodo)o[k]=extraerFotos(nodo[k],mapa);return o;}
  return nodo;
}
function reponerFotos(nodo,mapa){
  if(esRefFoto(nodo)){const id=nodo.slice(7);return mapa[id]||null;}
  if(Array.isArray(nodo))return nodo.map(x=>reponerFotos(x,mapa)).filter(x=>x!==null||true);
  if(nodo&&typeof nodo==="object"){const o={};for(const k in nodo)o[k]=reponerFotos(nodo[k],mapa);return o;}
  return nodo;
}
function refsDe(nodo,set){
  if(esRefFoto(nodo)){set.add(nodo.slice(7));return;}
  if(Array.isArray(nodo)){nodo.forEach(x=>refsDe(x,set));return;}
  if(nodo&&typeof nodo==="object")for(const k in nodo)refsDe(nodo[k],set);
}
const _fotosEnDisco=new Set();
async function guardarConFotos(coops,snapLista){
  const mapa={};
  const slim=extraerFotos(coops,mapa);
  const slimSnap=snapLista?extraerFotos(snapLista,mapa):null;
  // guardar solo las fotos nuevas
  const ids=Object.keys(mapa);
  for(const id of ids){if(_fotosEnDisco.has(id))continue;await stSave(FOTO_PFX+id,mapa[id]);_fotosEnDisco.add(id);}
  await stSave(DB_KEY,{v:2,coops:slim});
  return{slim,slimSnap,ids};
}
async function cargarConFotos(){
  const d=await stLoad(DB_KEY);
  if(!d||!d.coops)return null;
  if(d.v!==2)return d.coops; // formato viejo: las fotos ya vienen inline
  const set=new Set();refsDe(d.coops,set);
  const mapa={};
  for(const id of set){try{const f=await stLoad(FOTO_PFX+id);if(f)mapa[id]=f;_fotosEnDisco.add(id);}catch(e){}}
  return reponerFotos(d.coops,mapa);
}
async function limpiarFotosHuerfanas(usadas){
  try{
    const keys=(await stKeys(FOTO_PFX)).filter(k=>typeof k==="string"&&k.indexOf(FOTO_PFX)===0);
    for(const k of keys){const id=k.slice(FOTO_PFX.length);
      if(!id||usadas.has(id))continue;
      await stDelete(k);_fotosEnDisco.delete(id);}
  }catch(e){console.warn("limpieza fotos:",e);}
}
// ── Almacenamiento ────────────────────────────────────────────────────
// localStorage tiene un techo de ~5 MB para TODAS las claves juntas: con
// fotos se llena y se pierde el inventario. IndexedDB da cientos de MB en
// el celular, así que es el almacén principal. Se mantiene localStorage
// como respaldo y para leer los datos guardados por versiones anteriores.
const IDB_DB="inv-audit-db",IDB_ST="kv";
let _idbP=null;
function idbOpen(){
  if(_idbP)return _idbP;
  _idbP=new Promise((res,rej)=>{
    try{
      if(!window.indexedDB)return rej(new Error("IndexedDB no disponible"));
      const rq=indexedDB.open(IDB_DB,1);
      rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains(IDB_ST))d.createObjectStore(IDB_ST);};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error||new Error("No se pudo abrir IndexedDB"));
    }catch(e){rej(e);}
  });
  return _idbP;
}
function idbOp(modo,fn){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_ST,modo);const st=tx.objectStore(IDB_ST);
    let out;try{out=fn(st);}catch(e){return rej(e);}
    tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);
    tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("Transacción cancelada"));
  }));
}
const idbSet=(k,v)=>idbOp("readwrite",st=>st.put(v,k));
const idbGet=(k)=>idbOp("readonly",st=>st.get(k));
const idbDel=(k)=>idbOp("readwrite",st=>st.delete(k));
const idbKeys=()=>idbOp("readonly",st=>st.getAllKeys());

async function stSave(key,val){const s=JSON.stringify(val);let err=null;
  try{if(window.storage?.set){await window.storage.set(key,s);return true;}}catch(e){err=e;}
  try{await idbSet(key,s);
    // si quedó una copia vieja en localStorage, liberarla
    try{localStorage.removeItem(key);}catch(e){}
    return true;}catch(e){err=err||e;}
  try{localStorage.setItem(key,s);return true;}catch(e){err=err||e;}
  const mb=(s.length/1048576).toFixed(2);
  throw new Error((err&&err.message?err.message:"almacenamiento no disponible")+" (intentando guardar "+mb+" MB en '"+key+"')");}

async function stLoad(key){
  try{if(window.storage?.get){const r=await window.storage.get(key);if(r)return JSON.parse(r.value);}}catch(e){}
  try{const v=await idbGet(key);if(v!=null)return JSON.parse(v);}catch(e){}
  try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){}
  return null;}

async function stDelete(key){
  try{if(window.storage?.delete)await window.storage.delete(key);}catch(e){}
  try{await idbDel(key);}catch(e){}
  try{localStorage.removeItem(key);}catch(e){}}

async function stKeys(prefijo){
  const out=new Set();
  try{if(window.storage?.list){const r=await window.storage.list(prefijo);((r&&r.keys)||[]).forEach(k=>out.add(k));}}catch(e){}
  try{(await idbKeys()||[]).forEach(k=>out.add(String(k)));}catch(e){}
  try{for(let i=0;i<localStorage.length;i++)out.add(localStorage.key(i));}catch(e){}
  return [...out].filter(k=>!prefijo||k.indexOf(prefijo)===0);}

function App(){
  const[coops,setCoops]=useState([]);const[coopAct,setCoopAct]=useState(null);const[nNombre,setNNombre]=useState("");const[nLoc,setNLoc]=useState("");const[nCierre,setNCierre]=useState("");const[nFecha,setNFecha]=useState(new Date().toISOString().slice(0,10));const[nAuditores,setNAuditores]=useState([]);const[ddOpen,setDdOpen]=useState(false);
  const[showNuevo,setShowNuevo]=useState(false);const[showBackup,setShowBackup]=useState(false);

        <div style=${{overflowX:"auto",border:"1px solid #e2e8f0",borderRadius:8,marginBottom:12}}>
          <table style=${{width:"100%",borderCollapse:"collapse",fontSize:11}}>
            <thead><tr style=${{background:"#eff6ff"}}>${csvPrev.headers.map((h,i)=>html`<th key=${i} style=${{padding:"4px 6px",border:"1px solid #e2e8f0",minWidth:90}}>
              <div style=${{fontSize:10,color:"#94a3b8",marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${h}</div>
              <select value=${Object.entries(csvPrev.mapping).find(([k,v])=>v===i)?.[0]||"ignorar"} onChange=${e=>{const field=e.target.value;setCsvPrev(p=>{const m={...p.mapping};Object.keys(m).forEach(k=>{if(m[k]===i)m[k]=-1;});if(field!=="ignorar")m[field]=i;return{...p,mapping:m};});}} style=${{width:"100%",padding:"3px",border:"1.5px solid #93c5fd",borderRadius:4,fontSize:10,fontWeight:600,color:"#1a2e6b",background:"#f0f4ff"}}>
                <option value="ignorar">— Ignorar —</option>
                <option value="codigo">Código</option><option value="descripcion">Descripción</option><option value="stock">Stock</option><option value="unidad">Unidad</option><option value="importe">Importe total</option><option value="unitario">Precio unitario</option><option value="categoria">Categoría</option>
              </select>
            </th>`)}</tr></thead>
            <tbody>${csvPrev.rows.slice(0,5).map((row,ri)=>html`<tr key=${ri}>${csvPrev.headers.map((h,ci)=>{const field=Object.entries(csvPrev.mapping).find(([k,v])=>v===ci)?.[0];return html`<td key=${ci} style=${{padding:"3px 6px",border:"1px solid #f1f5f9",fontSize:10,color:field?"#1e293b":"#cbd5e1",fontWeight:field==="descripcion"?600:400,background:field==="stock"?"#fefce8":field==="codigo"?"#f0f4ff":""}}>${row[ci]||""}</td>`})}</tr>`)}</tbody>
          </table>
        </div>
        ${csvPrev.rows.length>5&&html`<p style=${{fontSize:10,color:"#94a3b8",marginBottom:8}}>Mostrando 5 de ${csvPrev.allRows.length} filas...</p>`}
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick=${()=>setCsvPrev(null)} style=${{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:600,color:"#475569"}}>Cancelar</button>
          <button onClick=${confirmCSV} disabled=${csvPrev.mapping.descripcion<0} style=${{background:csvPrev.mapping.descripcion>=0?"#1a2e6b":"#94a3b8",color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontSize:14,fontWeight:700}}>Importar ${csvPrev.allRows.length} productos ✓</button>
        </div>
      </div>
    </div>`}
    </div>`}
    ${showSnaps&&html`<div style=${{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1300,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style=${{background:"#fff",borderRadius:14,padding:16,width:"100%",maxWidth:520,maxHeight:"85vh",overflowY:"auto"}}>
        <h3 style=${{margin:"0 0 4px",fontSize:16,color:"#0369a1"}}>⏱ Puntos de restauración</h3>
        <p style=${{fontSize:11,color:"#64748b",margin:"0 0 12px",lineHeight:1.5}}>La app guarda sola una copia cada 10 minutos. Sirve si borraste algo por error o algo salió mal.</p>
        ${snaps.length===0?html`<p style=${{fontSize:13,color:"#94a3b8",textAlign:"center",padding:20}}>Todavía no hay puntos guardados.</p>`:snaps.map(s=>{const f=new Date(s.t);
          const fecha=String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0")+" "+String(f.getHours()).padStart(2,"0")+":"+String(f.getMinutes()).padStart(2,"0");
          let prod=0,cont=0;(s.datos||[]).forEach(cc=>(cc.sucursales||[]).forEach(ss=>Object.values(ss.secciones||{}).forEach(sd=>{const its=sd.items||[];prod+=its.length;cont+=its.filter(i=>i.stockFisico!==""&&i.stockFisico!=null).length;})));
          return html`<div key=${s.t} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"10px 12px",background:"#f0f9ff",borderRadius:8,marginBottom:6,border:"1px solid #bae6fd"}}>
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{fontSize:13,fontWeight:700,color:"#0c4a6e"}}>${fecha} ${s.manual?"(antes de restaurar)":""}</div>
              <div style=${{fontSize:10,color:"#64748b"}}>${(s.datos||[]).length} inventario(s) · ${prod} productos · ${cont} contados</div>
            </div>
            <button onClick=${()=>restaurarSnapshot(s.t)} style=${{background:"#0369a1",color:"#fff",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>Restaurar</button>
          </div>`;})}
        <div style=${{display:"flex",justifyContent:"flex-end",marginTop:10}}>
          <button onClick=${()=>setShowSnaps(false)} style=${{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,padding:"9px 18px",fontSize:13,color:"#475569"}}>Cerrar</button>
        </div>
      </div>
    </div>`}
    ${showPegar&&html`<div style=${{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style=${{background:"#fff",borderRadius:14,padding:16,width:"100%",maxWidth:560,maxHeight:"88vh",overflowY:"auto"}}>
        <h3 style=${{margin:"0 0 6px",fontSize:16,color:"#1a2e6b"}}>Pegar datos del compañero</h3>
        <p style=${{fontSize:12,color:"#64748b",margin:"0 0 10px",lineHeight:1.5}}>Si al tocar el archivo en WhatsApp se abre en el navegador en vez de descargarse, hacé esto:<br/>
        1) En esa pantalla mantené presionado el texto y elegí <b>Seleccionar todo</b><br/>
        2) Tocá <b>Copiar</b><br/>
        3) Volvé acá y pegá abajo</p>
        <textarea value=${pegarTxt} onInput=${e=>setPegarTxt(e.target.value)} placeholder='Pegá acá el contenido (empieza con {"v":1,"tipo":"inventario_aca"...)' style=${{width:"100%",height:150,padding:10,border:"1.5px solid #cbd5e1",borderRadius:10,fontSize:11,fontFamily:"monospace",resize:"vertical"}} />
        ${pegarTxt&&html`${(()=>{const t=pegarTxt.trim();const tieneIni=t.indexOf("{")>=0;const cierra=t.lastIndexOf("}")>t.indexOf("{");
          const est=!tieneIni?{c:"#dc2626",m:"⚠ No parece el contenido correcto. Tiene que empezar con {"}:!cierra?{c:"#dc2626",m:"⚠ El texto está cortado — falta el final. Volvé a copiar asegurándote de seleccionar todo, o pedí el archivo de nuevo."}:{c:"#16a34a",m:"✓ Contenido completo ("+Math.round(pegarTxt.length/1024)+" KB)"};
          return html`<p style=${{fontSize:11,color:est.c,margin:"6px 0 0",lineHeight:1.4}}>${est.m}</p>`;})()}`}
        <div style=${{display:"flex",gap:8,justifyContent:"space-between",marginTop:12,flexWrap:"wrap"}}>
          <button onClick=${()=>setPegarTxt("")} disabled=${!pegarTxt} style=${{background:pegarTxt?"#fef2f2":"#f8fafc",border:"1px solid "+(pegarTxt?"#fecaca":"#e2e8f0"),borderRadius:8,padding:"9px 14px",fontSize:13,color:pegarTxt?"#dc2626":"#cbd5e1",fontWeight:600}}>🗑 Limpiar</button>
          <div style=${{display:"flex",gap:8}}>
            <button onClick=${()=>(setShowPegar(false),setPegarTxt(""))} style=${{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,padding:"9px 16px",fontSize:13,color:"#475569"}}>Cancelar</button>
            <button onClick=${importarPegado} disabled=${!pegarTxt.trim()} style=${{background:pegarTxt.trim()?"#7c3aed":"#cbd5e1",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:700}}>Importar</button>
          </div>
        </div>
      </div>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body></html>
